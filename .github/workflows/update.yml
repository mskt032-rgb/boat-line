# BOAT RACE公式サイトから情報を取得し、GitHub Pagesで公開する
# - 日本時間 6時〜23時のあいだ、約10分ごとに実行する
#   GitHubの定期実行(schedule)は大きく遅れたり飛ばされたりするため、
#   各実行の最後に「10分たったら次の実行を1つだけ予約する」形でつなぐ。定期実行は15分ごとの予備(同時に動くのは1つ・待ちも1つまでなので、取得の頻度は増えない)。
# - 取得したデータは data ブランチに保存(毎回1つのコミットに置き換え、容量を増やさない)
name: データ更新と公開
on:
  schedule:
    - cron: '7,22,37,52 21-23,0-13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  actions: write
  contents: write
  pages: write
  id-token: write
concurrency:
  group: boatline-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - name: 開始時刻を記録
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 前回までのデータを読み込む
        run: |
          mkdir -p store
          if git ls-remote --exit-code origin refs/heads/data >/dev/null 2>&1; then
            git fetch -q --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C store
          fi
      - name: 公式サイトから取得(残り時間は展示の見張り)
        run: WATCH_UNTIL=$(( STARTED_AT + 510 )) ARCHIVE_OUT=archive-out node scraper/run.mjs store/data
      - name: 45日より古い日を archive ブランチに保存(1年以上残す)
        run: |
          if [ -d archive-out ] && [ -n "$(ls -A archive-out)" ]; then
            url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git clone -q --depth 1 --branch archive "$url" arch 2>/dev/null || { mkdir arch && git -C arch init -q -b archive; }
            cp -r archive-out/. arch/
            cd arch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -qm "archive $(ls ../archive-out/*/ | tr '\n' ' ')" && git push -q "$url" HEAD:archive
          fi
      - name: データを data ブランチに保存
        run: |
          cd store
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp -r app/. _site/
          cp -r store/data _site/data
          # 版ごとに読み込み先の名前を変え、iPhoneに残った古い部品を使わせない
          v=${GITHUB_SHA::8}
          sed -i "s#js/main.js#js/main.js?v=$v#; s#style.css#style.css?v=$v#" _site/index.html
          sed -i -E "s#from '\./([a-z]+)\.js'#from './\1.js?v=$v'#g" _site/js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 公開に失敗したら少し待つ
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: もう一度失敗したら少し待つ
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: 次の実行を予約(夜間は朝6時まで待つ)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now_min=$(( ( $(date -u +%s) / 60 + 9 * 60 ) % 1440 ))
          if [ "$now_min" -lt 360 ] || [ "$now_min" -ge 1370 ]; then
            # 夜は取得しない。朝6時に確実に始めるため、6時まで(最長5時間20分)待ってから次を予約する
            until6=$(( ( (360 - now_min + 1440) % 1440 ) * 60 ))
            wait=$(( until6 < 19200 ? until6 : 19200 ))
            echo "夜間のため ${wait} 秒待ってから次の実行を予約します"
          else
            wait=$(( STARTED_AT + 600 - $(date +%s) ))
          fi
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" --workflow update.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$waiting" -gt 0 ]; then echo "すでに次の実行が待っています"; exit 0; fi
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "次の実行を予約しました"
